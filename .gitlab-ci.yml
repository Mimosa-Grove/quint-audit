# GitLab CI port of .github/workflows/ci.yml. One job: the suite is the
# gate. quint is installed at the pinned version and its presence is asserted,
# so the integration cells never skip silently.

stages:
  - test

test:
  stage: test
  image: ocaml/opam:debian-12-ocaml-5.3
  before_script:
    - sudo apt-get update -qq
    - sudo apt-get install -y -qq nodejs npm
    - export PATH="$(npm prefix -g)/bin:$PATH"
    - sudo npm install -g @informalsystems/quint@0.33.1
    - test "$(quint --version)" = "0.33.1"
    - opam install . --deps-only --with-test --yes
  script:
    - opam exec -- dune build
    - opam exec -- dune runtest --force
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - _build/log
      - _build/default/test/_build/_tests
